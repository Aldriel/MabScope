# ----- Tooltips -----
tip.tabHelp=Help on this tab (F1)
tip.scheme=Definition of the CDR boundaries. Kabat: based on sequence variability. Chothia: \
    based on the structural loops. AbM: compromise used by Oxford Molecular’s AbM software.
tip.examples=Fill in the sequences of a therapeutic antibody and analyze them.
tip.demo=Loads trastuzumab and simulated peptide mapping results of three samples: two lots and \
    a sample stressed at 40 °C.
tip.cdrOnly=Shows only the sites inside the CDRs, where a modification can change the binding.
tip.riskFilter=Minimum risk of the sites shown.
tip.missedCleavages=Maximum number of internal cleavage sites left uncleaved in a peptide.
tip.alkylated=Cysteines reduced and alkylated with iodoacetamide (+57.021 Da), as in most \
    peptide mapping protocols.
tip.import=Reads MaxQuant evidence.txt, FragPipe psm.tsv, a Skyline report or a generic table \
    (sequence in ProForma, sample, intensity).
tip.format=Automatic: the format is recognized from the columns of the file.
tip.reference=Sample the other samples are compared with, usually the reference standard.
tip.threshold=Largest acceptable difference with the reference, in percentage points.
tip.paper=US Letter in North America, A4 elsewhere.
